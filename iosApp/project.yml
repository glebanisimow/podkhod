# Xcode project for the iPhone app, generated on a Mac with XcodeGen:
#   brew install xcodegen && cd iosApp && xcodegen
# The Kotlin side (screens, data, logic) is the :shared framework, built by Gradle from the build phase below.
name: Podkhod
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Podkhod:
    type: application
    platform: iOS
    sources:
      - path: Podkhod
    info:
      path: Podkhod/Info.plist
      properties:
        CFBundleDisplayName: Подход
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PODKHOD_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(PODKHOD_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
