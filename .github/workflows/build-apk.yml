name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PODKHOD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret PODKHOD_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PODKHOD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :domain:jvmTest :app:testDebugUnitTest

      - name: Assemble signed release APK
        env:
          PODKHOD_KEYSTORE_PASSWORD: ${{ secrets.PODKHOD_KEYSTORE_PASSWORD }}
          PODKHOD_KEY_ALIAS: ${{ secrets.PODKHOD_KEY_ALIAS }}
          PODKHOD_KEY_PASSWORD: ${{ secrets.PODKHOD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "podkhod-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: podkhod-release-apk
          path: podkhod-*.apk
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: podkhod-*.apk
